<!DOCTYPE html>
<html>
    <head>
        <title>CSS Styling Example</title>
        <!--Internal CSS -->
        <style>
            h2{
                colour:green;
            }
            *{
                font-size: 38px;
                font-weight: 500;
            }
        
            h3{
                colour:blue;
            }
            /* element selector /*
        h4{
            colour:palevioletred;
        }
            /* class selector/*
        .myclass{
            colour:darkorange;
        }
            /* id selector /*
        #myid{
            colour:mediumpurple;
        }
            /* group selector/*
        h5,p{
            colour:maroon;
        }
            
        </style>

    </head>
    <body>
        <hr>
        <!--Inline CSS -->
        <h1 style="colour: red;">INLINE CSS EXAMPLE</h1> 
        <!--Internal CSS-->
        <h2> INTERNAL CSS EXAMPLE</h2>
        <!--External CSS -->
        <h3> EXTERNAL CSS EXAMPLE</h3>
        <hr>

        <!--element selector example -->
        <h4>ELEMENT SELECTOR EXAMPLE</h4>
        <h4>ELEMENT SELECTOR EXAMPLE</h4>
        <hr>

        <!--class and id selector example -->
        <h2 class="myclass">CLASS SELECTOR EXAMPLE</h2>
        <h2 id="myid"> ID SELECTOR EXAMPLE</h2>
        <h2 class="myclass">CLASS SELECTOR EXAMPLE</h2>
        <hr>

        <!--group selector example -->
        <h5>GROUP SELECTOR EXAMPLE</h5>
        <p>GROUP SELECTOR EXAMPLE</p>
        <hr>


    </body>
</html>
