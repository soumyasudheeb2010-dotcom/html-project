<!DOCTYPE html>
<html>
    <head>
        <title>Typography</title>
        <style>
            .Text1 {
                color:red;
                font-size: 10px;
            }
                div {
                    width: 300px;
                    height: 120px;
                    background-color: yellow;
                    border: 1px solid black;
                }
                #myDiv{
                    transform: rotateX(180deg);
                }
            
        </style>
    </head>
    <body>
        <h1>Typeography</h1>
        <p class="Text1">welcome to codingal</p>
        <p class="p1">Welcome to codingal</p>
        <p>Ready to learn the rotate method....</p>
        <div>
            Codingal
        </div>
        <div id="myDiv">
            Codingal
        </div>
    </body>
</html>
